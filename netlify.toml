[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@sparticuz/chromium"]

[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"

[[headers]]
  for = "/"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[redirects]]
  from = "https://www.buildmycvnow.com/*"
  to = "https://buildmycvnow.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/builder/*"
  to = "/builder/index.html"
  status = 200
